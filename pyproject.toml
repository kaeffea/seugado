[project]
name = "seugado"
version = "0.1.0"
description = "Sistema prescritivo de manejo de pastagens por satelite"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.45",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown fora do escopo: o ruff reformatava blocos de codigo dentro dos
# documentos 00-12, que o Claude Code nao tem permissao de tocar (RELATORIO-REV-001 A2).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PL"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"


[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["ee", "ee.*"]
ignore_missing_imports = true
